name: Editorial and site checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site and blog invariants
        run: node --test tests
