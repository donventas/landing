name: Editorial and site checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved appearance baseline for preservation checks
        run: git fetch --no-tags --depth=1 origin c487c25184ec05feed526e36572d274acb9d4eb0
      - name: Fetch approved translation baseline for preservation checks
        run: git fetch --no-tags --depth=1 origin 083d00e4e8473dd506d589a0e7814a0364f67663
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site and blog invariants
        run: node --test
